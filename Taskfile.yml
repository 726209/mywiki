# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  GREETING: Hello, world!

tasks:
  list:
    desc: task list
    cmds:
      - task --list
    silent: true
  hello:
    desc: Print a greeting message
    cmds:
      - echo "{{.GREETING}}"
    silent: true
# =============================================
  # 1. 安全与质量保障 (Security & Checks)
  # =============================================
  scan:
    desc: "使用 Gitleaks 进行全量敏感信息安全扫描"
    cmds:
      - gitleaks detect --source . --verbose

  # =============================================
  # 2. VitePress 知识库操作 (Knowledge Base)
  # =============================================
  dev:
    desc: "启动 VitePress 本地预览服务"
    cmds:
      - pnpm docs:dev

  build:
    desc: "构建 VitePress 静态网页"
    cmds:
      - pnpm docs:build

  # =============================================
  # 3. Git 自动化操作与发布工作流 (Workflow & Deploy)
  # =============================================
  commit:
    desc: "安全提交代码 (提交前自动执行 Gitleaks 安全扫描)"
    # deps: [scan]
    cmds:
      - git add .
      - git status
      - 'git commit -m "{{.CLI_ARGS}}"'
    requires:
      vars: [CLI_ARGS] # 要求必须传入提交信息，例如: task commit -- "docs: update notes"

  release:
    desc: "一键发布：构建知识库并推送到 GitHub (触发 Cloudflare 自动部署)"
    deps: [build]
    cmds:
      - git add .
      - 'git commit -m "{{.CLI_ARGS | default "chore: auto-build and deploy knowledge base"}}"'
      - git push origin main
      - echo "✨ 成功推送到 GitHub，Cloudflare Pages 正在自动重新部署..."
